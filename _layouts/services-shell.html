---
layout: base
---
{%- comment -%}
  Services shell (/services/): no top banner at all; footer with email and LinkedIn only.
  No menu, CV or GitHub, and nothing links to the Profile pages.
{%- endcomment -%}
  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ site.time | date: '%Y' }} {{ site.author }}</p>
      <ul class="footer-links">
        <li><a href="mailto:{{ site.email }}">Email</a></li>
        <li><a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a></li>
      </ul>
    </div>
  </footer>
